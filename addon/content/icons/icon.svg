<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21.07421875 20.3038330078125" width="32" height="32" fill="none">
  <style>
    /* GEYI-645:深色主题下这块 near-black 在深底上几乎看不见,而这里既不能用
       -moz-context-properties/context-fill —— Zotero 那两个槽位是拿 CSS
       background 画图标的,background-image 拿不到 context 属性(见
       src/modules/taskPane.ts 里 GEYI-618 那段注释)—— 也没有 darkIcon 之类的
       清单字段可用。所以改从 SVG 文档自己这一侧做:媒体查询命中就换色,不命中
       就完全维持原样(下面的 fill presentation 属性仍是唯一生效值),**不可能
       比现在更差**。品牌橙 #D14109 深浅两色都读得清,两边都不动。 */
    @media (prefers-color-scheme: dark) {
      .geyi-ink { fill: #e8e8e8; }
    }
  </style>
