<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      class="geyi-prefs">
  <groupbox>
    <label><html:h2 id="geyi-pref-account-title" /></label>
    <hbox align="center" style="gap: 8px;">
      <label id="geyi-account-status" />
      <button id="geyi-login-btn" />
      <button id="geyi-manual-btn" />
      <button id="geyi-logout-btn" hidden="true" />
      <button id="geyi-upgrade-btn" hidden="true" />
    </hbox>
    <description id="geyi-account-detail" class="geyi-muted" />
    <description id="geyi-membership-hint" class="geyi-muted" />
  </groupbox>

  <groupbox>
    <label><html:h2 id="geyi-pref-defaults-title" /></label>

    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-target" flex="1" />
      <menulist id="geyi-target-language">
        <menupopup>
          <menuitem value="zh-CN" label="简体中文 (zh-CN)" />
          <menuitem value="zh-TW" label="繁體中文 (zh-TW)" />
          <menuitem value="en" label="English (en)" />
          <menuitem value="ja" label="日本語 (ja)" />
          <menuitem value="ko" label="한국어 (ko)" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-layout" flex="1" />
      <menulist id="geyi-layout-mode">
        <menupopup>
          <menuitem id="geyi-layout-reflow" value="reflow" />
          <menuitem id="geyi-layout-preserve" value="preserve" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-precision" flex="1" />
      <menulist id="geyi-precision-mode">
        <menupopup>
          <menuitem id="geyi-precision-high" value="high" />
          <menuitem id="geyi-precision-standard" value="standard" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-output" flex="1" />
      <menulist id="geyi-output-format">
        <menupopup>
          <menuitem id="geyi-output-pdf" value="pdf" />
          <menuitem id="geyi-output-bilingual" value="pdf_bilingual" />
          <menuitem id="geyi-output-docx" value="docx" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-speed" flex="1" />
      <menulist id="geyi-speed-mode">
        <menupopup>
          <menuitem id="geyi-speed-fast" value="fast" />
          <menuitem id="geyi-speed-slow" value="slow" />
        </menupopup>
      </menulist>
    </hbox>
    <description id="geyi-speed-hint" class="geyi-muted" />

    <checkbox id="geyi-auto-note" />
    <checkbox id="geyi-notify" />
  </groupbox>

  <groupbox>
    <label><html:h2 id="geyi-pref-advanced-title" /></label>
    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-concurrency" flex="1" />
      <html:input id="geyi-concurrency" type="number" min="1" max="3" style="width: 72px;" />
    </hbox>
    <hbox align="center" style="gap: 8px;">
      <label id="geyi-lbl-log-level" flex="1" />
      <menulist id="geyi-log-level">
        <menupopup>
          <menuitem id="geyi-log-error" value="error" />
          <menuitem id="geyi-log-info" value="info" />
          <menuitem id="geyi-log-debug" value="debug" />
        </menupopup>
      </menulist>
    </hbox>
    <description id="geyi-upload-strategy" class="geyi-muted" />
  </groupbox>

  <groupbox>
    <label><html:h2 id="geyi-pref-about-title" /></label>
    <description id="geyi-version" />
    <hbox style="gap: 8px;">
      <button id="geyi-open-web" />
      <button id="geyi-manage-glossary" />
      <button id="geyi-help" />
    </hbox>
    <hbox style="gap: 8px;">
      <button id="geyi-feedback" />
      <button id="geyi-privacy" />
    </hbox>
  </groupbox>
</vbox>
