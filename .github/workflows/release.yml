name: release

# GEYI-399：插件商店（syt2/zotero-addons-scraper）按 GitHub Releases 抓取新版本，
# 故上架后每次发版都必须留下一个挂着 .xpi 的 Release。打 tag 即发布：
#   npm version patch && git push --follow-tags
# 网页端分发（www.geyi.net/plugin/，GCS）仍走 `npm run publish:web`，两者互不依赖。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # GEYI-428：版本单调闸要拿历史 tag 当基线，默认的浅克隆看不到它们，
      # 闸会解析失败并「误判放行」（fail-open）。fetch-depth: 0 + fetch-tags
      # 是那道闸能真正生效的前提；脚本侧也会主动拒绝 shallow 仓库兜底。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # tag 与 package.json 不一致会发出版本号对不上的 Release，客户端据 update.json
      # 的 version 判断更新，错位即静默不升级——先失败掉。
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$expected" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          }

      # GEYI-428：上面那道只校验「tag 与 package.json 对号」，拦不住「两者一致
      # 但都没 bump」——那正是 src 改了却以旧版本号发布的事故形态。这道闸以上一个
      # v* tag 为基线，src/ 或 addon/ 有变更就要求版本严格增长。
      - name: Verify release version is monotonic
        run: node scripts/check-release-version.mjs

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # GEYI-461 起 update.json 也一并挂上。
      #
      # 它此前被排除的唯一理由是「CI 与本地各自打包，zip 元数据不同，hash 必然
      # 对不上，挂上去只会得到一份自相矛盾的清单」。那个前提已经不成立：
      # scripts/build.mjs 现在把 zip 条目时间戳压成固定值（本地时间
      # 1980-01-01 00:00）并重算清单 hash，同一 commit 在 CI 与本地产出逐字节
      # 相同的 xpi —— 已实测跨秒、跨四个时区、跨构建目录均一致。
      #
      # 前提是 CI 用 `npm ci` 装真实 node_modules。若哪天改成 symlink 过来的
      # node_modules，esbuild 会把它解析成绝对路径写进模块注释，产物字节随之
      # 改变，这份清单就又会与 Release 里的 xpi 对不上号。
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/geyi-translator.xpi \
            build/update.json
